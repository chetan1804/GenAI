[project]
name = "genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chetan1804", email = "chetanshinde265@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.16.0",
    "groq>=1.6.0",
    "langchain>=1.3.14",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.4.1",
    "mistralai>=2.8.0",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
genai = "genai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
